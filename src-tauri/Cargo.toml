[package]
name = "hghubx"
version = "2.2.10"
description = "HGhubX pure-Rust client"
authors = ["HGhubX"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "hghubx_lib"
crate-type = ["rlib"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query", "matched-path"] }
http = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rust-embed = "8"
mime_guess = { version = "2", default-features = false }
dirs = "6"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dom_query = { version = "=0.28.0", default-features = false }
time = { version = "0.3", features = ["formatting"] }
# 纯 Rust TLS + 加密：使用 rustls-rustcrypto 与 RustCrypto (p256/hkdf/aes-gcm/sha2) 替代 ring，零 C/C++ 依赖。
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls-webpki-roots-no-provider",
  "system-proxy",
  "socks",
  "gzip",
  "brotli",
  "json",
  "charset",
] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.0.2-alpha"
aes = "0.8"
aes-gcm = "0.10"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh"] }
sha2 = "0.10"
base64 = "0.22"
percent-encoding = "2"
once_cell = "1"
url = "2"
hyper-util = { version = "0.1.21", features = ["client-proxy", "client-proxy-system"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"
